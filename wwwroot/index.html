<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arquivo de PDFs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAEAE2;
    --surface: #FFFFFF;
    --surface-alt: #F2EEE1;
    --ink: #20261E;
    --ink-soft: #5C6357;
    --accent: #2B6E5C;
    --accent-soft: #DDEAE3;
    --danger: #A6402F;
    --danger-soft: #F4E1DC;
    --border: #D6D2C2;
    --shadow: 0 1px 2px rgba(32,38,30,0.06), 0 6px 16px rgba(32,38,30,0.06);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: clamp(1.25rem, 4vw, 3.5rem) 1rem 4rem;
    min-height: 100vh;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.4rem;
  }

  h1 {
    font-family: 'IBM Plex Serif', serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4.5vw, 2.15rem);
    margin: 0 0 0.35rem;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0;
  }

  /* ---- Dropzone styled like a folder tab ---- */
  .dropzone {
    position: relative;
    background: var(--surface-alt);
    border: 1.5px dashed var(--border);
    border-radius: 4px 14px 14px 14px;
    padding: clamp(1.5rem, 4vw, 2.25rem) 1.25rem;
    text-align: center;
    margin-bottom: 1.75rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .dropzone::before {
    content: 'PDF';
    position: absolute;
    top: -1px;
    left: -1.5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--surface);
    background: var(--accent);
    padding: 0.22rem 0.6rem;
    border-radius: 4px 10px 10px 0;
    transform: translateY(-100%);
  }

  .dropzone.drag-active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .dropzone p {
    margin: 0 0 1rem;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .dropzone p strong {
    color: var(--ink);
  }

  .file-input-label {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 0.55rem 1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .file-input-label:hover {
    border-color: var(--accent);
  }

  #fileInput {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
  }

  .selected-name {
    display: block;
    margin-top: 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    min-height: 1.1em;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .upload-btn {
    display: block;
    width: 100%;
    margin-top: 1.1rem;
    background: var(--accent);
    color: #fff;
    padding: 0.7rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    transition: opacity 0.15s ease;
  }

  .upload-btn:not(:disabled):hover {
    opacity: 0.92;
  }

  #status {
    margin-top: 0.65rem;
    font-size: 0.82rem;
    min-height: 1.2em;
    color: var(--ink-soft);
  }

  #status[data-tone="error"] { color: var(--danger); }
  #status[data-tone="success"] { color: var(--accent); }

  /* ---- File list as index cards ---- */
  .list-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .list-heading h2 {
    font-family: 'IBM Plex Serif', serif;
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
  }

  .list-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }

  ul#fileList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .file-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px 10px 10px 4px;
    box-shadow: var(--shadow);
    padding: 0.85rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .file-info {
    min-width: 0;
    flex: 1 1 200px;
  }

  .file-name {
    font-weight: 600;
    font-size: 0.92rem;
    overflow-wrap: anywhere;
  }

  .file-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 0.2rem;
    letter-spacing: 0.01em;
  }

  .actions {
    display: flex;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 0.4rem 0.7rem;
    border-radius: 6px;
    text-decoration: none;
    border: 1px solid transparent;
  }

  .download-link {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .download-link:hover {
    border-color: var(--accent);
  }

  .delete-btn {
    color: var(--danger);
    background: var(--danger-soft);
  }

  .delete-btn:hover {
    border-color: var(--danger);
  }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.85rem;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 2rem 1rem;
  }

  @media (max-width: 480px) {
    .file-card {
      flex-direction: column;
      align-items: stretch;
    }
    .actions {
      justify-content: stretch;
    }
    .icon-btn {
      flex: 1;
      justify-content: center;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <p class="eyebrow">Arquivo digital</p>
      <h1>Seus PDFs</h1>
      <p class="subtitle">Envie um documento e baixe quando precisar.</p>
    </header>

    <div class="dropzone" id="dropzone">
      <p>Arraste um PDF até aqui, ou</p>
      <label class="file-input-label" for="fileInput">
        Escolher arquivo
      </label>
      <input type="file" id="fileInput" accept="application/pdf" />
      <span class="selected-name" id="selectedName"></span>
      <button class="upload-btn" id="uploadBtn">Enviar PDF</button>
      <div id="status"></div>
    </div>

    <div class="list-heading">
      <h2>Documentos enviados</h2>
      <span class="list-count" id="listCount"></span>
    </div>

    <ul id="fileList"></ul>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const selectedName = document.getElementById('selectedName');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const fileList = document.getElementById('fileList');
    const listCount = document.getElementById('listCount');

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function setStatus(message, tone) {
      status.textContent = message;
      if (tone) {
        status.setAttribute('data-tone', tone);
      } else {
        status.removeAttribute('data-tone');
      }
    }

    function updateSelectedName() {
      const file = fileInput.files[0];
      selectedName.textContent = file ? file.name : '';
    }

    fileInput.addEventListener('change', updateSelectedName);

    ['dragenter', 'dragover'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-active');
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-active');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) {
        fileInput.files = e.dataTransfer.files;
        updateSelectedName();
      }
    });

    async function loadFiles() {
      const res = await fetch('/files');
      const files = await res.json();
      fileList.innerHTML = '';
      listCount.textContent = files.length > 0
        ? files.length + (files.length === 1 ? ' arquivo' : ' arquivos')
        : '';

      if (files.length === 0) {
        fileList.innerHTML = '<li class="empty-state">Nenhum documento arquivado ainda.</li>';
        return;
      }

      for (const f of files) {
        const li = document.createElement('li');
        li.className = 'file-card';
        li.innerHTML = `
          <div class="file-info">
            <div class="file-name">${f.fileName}</div>
            <div class="file-meta">${formatSize(f.sizeInBytes)} · ${new Date(f.uploadedAt).toLocaleString('pt-BR')}</div>
          </div>
          <div class="actions">
            <a class="icon-btn download-link" href="/files/download?url=${encodeURIComponent(f.url)}&fileName=${encodeURIComponent(f.fileName)}">Baixar</a>
            <button class="icon-btn delete-btn" data-url="${f.url}">Excluir</button>
          </div>
        `;
        fileList.appendChild(li);
      }

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          await fetch(`/files?url=${encodeURIComponent(btn.dataset.url)}`, { method: 'DELETE' });
          loadFiles();
        });
      });
    }

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        setStatus('Selecione um arquivo PDF primeiro.', 'error');
        return;
      }

      uploadBtn.disabled = true;
      setStatus('Enviando...');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/files/upload', { method: 'POST', body: formData });
        if (!res.ok) {
          const msg = await res.text();
          throw new Error(msg || 'Falha no upload');
        }
        setStatus('Upload concluído.', 'success');
        fileInput.value = '';
        updateSelectedName();
        loadFiles();
      } catch (err) {
        setStatus('Erro: ' + err.message, 'error');
      } finally {
        uploadBtn.disabled = false;
      }
    });

    loadFiles();
  </script>
</body>
</html>
